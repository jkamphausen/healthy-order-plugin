name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point to a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Build archives
        run: scripts/package.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag $PRE
